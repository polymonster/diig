name: release
on:
  push:
    tags:
    - '*'
jobs:
  setup:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - name: create_release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
  release_tesflight:
    needs: setup
    uses: ./.github/workflows/ios-testflight.yml
    with:
      beta: false
    secrets: inherit
  release_google_play:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.DIIG_REG_TOKEN }} 
    - name: setup_jdk
      uses: actions/setup-java@v1
      with:
        java-version: 21.0
    - name: setup_gradle
      uses: gradle/actions/setup-gradle@v3
      with:
          gradle-version: 8.14.3 
    - name: setup_env
      run: |
        echo $env:ANDROID_HOME
        echo $env:JAVA_HOME
        echo $env:PATH
        java -version
    - name: resolve_secrets
      run: |
        absPath=$(realpath app/dist/android/upload-keystore.jks)
        echo "ABS_KEYSTORE_PATH=$absPath" >> "$GITHUB_ENV"
        echo '${{secrets.ANDROID_API_KEY_H}}' >> app/code/api_key.h
    - name: bump_version
      env:
        REFS_VERSION: ${{github.ref}}
      run: |
        VERSION=$(echo "$REFS_VERSION" | cut -d'/' -f 3)
        VERSION=$(echo "$VERSION" | cut -d'.' -f 3)
        echo "Version code: $VERSION"
        sed -i "s/androidversioncode \"[0-9]*\"/androidversioncode \"$VERSION\"/g" app/premake5.lua
    - name: build
      run: |
        cd app
        pmtech/pmbuild android
        cd build/android
        gradle wrapper
        ./gradlew bundleRelease "-Pandroid.injected.signing.store.file=$ABS_KEYSTORE_PATH" "-Pandroid.injected.signing.store.password=${{secrets.GOOGLE_PLAY_SIGNING_KEYSTORE_PASSWORD}}" "-Pandroid.injected.signing.key.alias=upload-key" "-Pandroid.injected.signing.key.password=${{secrets.GOOGLE_PLAY_SIGNING_KEYSTORE_PASSWORD}}"
    - name: upload
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{secrets.SERVICE_ACCOUNT_JSON}}
        packageName: pmtech.diig
        releaseFiles: "app/build/android/diig/build/outputs/bundle/release/diig-release.aab"
        track: internal
        status: completed
