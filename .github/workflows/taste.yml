name: taste
on:
  workflow_dispatch:
    inputs:
      full:
        description: "rebuild from scratch instead of only adding new collection items"
        type: boolean
        default: false
jobs:
  taste:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.DIIG_REG_TOKEN }}
    - name: install_deps
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade google-auth requests python3-discogs-client
    - name: pull_reg
      run: |
        cd scrape/diig-registry
        git fetch origin main
        git checkout main
        git pull origin main
    - name: taste
      run: |
        cd scrape
        python3 taste.py -discogs-key '${{secrets.DISCOGS_KEY}}' -user polymonster -key '${{secrets.SERVICE_ACCOUNT}}' ${{ inputs.full && '-full' || '' }}
    - name: commit_reg
      run: |
        cd scrape/diig-registry
        git config user.name github-actions
        git config user.email github-actions@github.com
        for i in {1..5}; do
          git add taste
          git commit -m "- update taste profile" || true
          if git pull --rebase origin main && git push origin HEAD:main; then
            break
          fi
          echo "Push failed, retrying ($i/5)..."
          sleep 2
        done
    - name: commit_submodule
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add scrape/diig-registry
        git diff --staged --quiet || git commit -m "- bump diig-registry submodule to latest"
        git config --unset-all http.https://github.com/.extraheader || true
        git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
        git pull --rebase origin main
        git push origin HEAD:main
