name: update_stores
on:
  workflow_dispatch:
jobs:
  update_stores:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false
        token: ${{ secrets.DIIG_REG_TOKEN }} 
    # only the registry, the scrapers don't need pmtech
    - name: checkout_submodules
      run: git submodule update --init --recursive scrape/diig-registry
    - name: install_deps
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade google-auth
    - name: update_stores
      run: |
        cd scrape
        python3 dig.py -update-stores -key '${{secrets.SERVICE_ACCOUNT}}'
